<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thalam tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Tamil&family=Mukta+Malar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEE6; --surface:#F7F8F3; --ink:#22261F; --muted:#5E6458;
  --kumkum:#A8223A; --brass:#8E6A17; --line:#CDD1C3; --dot:#B9BEAF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191C17; --surface:#22261F; --ink:#E8EADF; --muted:#A3A898;
    --kumkum:#E8677B; --brass:#D6B25A; --line:#3A3F34; --dot:#4C5245; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191C17; --surface:#22261F; --ink:#E8EADF; --muted:#A3A898;
  --kumkum:#E8677B; --brass:#D6B25A; --line:#3A3F34; --dot:#4C5245; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Mukta Malar","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 18px 40px}
h1{font-family:"Tiro Tamil","Noto Serif Tamil",Georgia,serif;font-weight:400;font-size:2.1rem;line-height:1.1;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.lead{color:var(--muted);margin:0 0 24px}
.tool{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:12px;color:var(--ink);text-decoration:none;transition:border-color .15s}
.tool:hover,.tool:focus-visible{border-color:var(--ink)}
.tool:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.tool .pat{display:flex;align-items:center;gap:5px;flex:none;width:96px}
.pat i{display:block;height:16px;border-radius:8px;background:var(--ink)}
.pat i.w{background:none;border:2px solid var(--ink)}
.tool h2{font-family:"Tiro Tamil",Georgia,serif;font-weight:400;font-size:1.4rem;margin:0;line-height:1.2}
.tool p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.tool .go-arrow{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.soon{border:1px dashed var(--line);border-radius:18px;padding:16px;color:var(--muted);text-align:center;font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>Thalam tools</h1>
  <p class="lead">Practice companions for Carnatic rhythm. Pick a thalam to start.</p>

  <a class="tool" href="rupaka/">
    <span class="pat" aria-hidden="true"><i style="width:16px"></i><i style="width:16px"></i><i class="w" style="width:16px"></i></span>
    <span><h2>Rupaka</h2><p>3 counts · clap, clap, wave · “ta ki ta”</p></span>
    <span class="go-arrow" aria-hidden="true">›</span>
  </a>

  <a class="tool" href="misra-chapu/">
    <span class="pat" aria-hidden="true"><i class="w" style="width:30px"></i><i style="width:20px"></i><i style="width:20px"></i></span>
    <span><h2>Misra chapu</h2><p>7 aksharas · 3 + 2 + 2 · “ta ki ta ta ka di mi”</p></span>
    <span class="go-arrow" aria-hidden="true">›</span>
  </a>

  <div class="soon">More thalams and music tools coming soon</div>
</main>
</body>
</html>
